<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt - Video Downloader Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 svg {
            width: 28px;
            height: 28px;
            color: #FF6B00;
        }

        .section {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .section h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #c0c0c0;
            cursor: pointer;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #FF6B00;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            background: #0f0f23;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #FF6B00;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        .toggle {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #333;
            transition: 0.3s;
            border-radius: 24px;
        }

        .toggle .slider::before {
            content: '';
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle input:checked+.slider {
            background: #FF6B00;
        }

        .toggle input:checked+.slider::before {
            transform: translateX(20px);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B00, #FF3D00);
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 0 4px 16px rgba(255, 61, 0, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #c0c0c0;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border-radius: 20px;
            font-size: 13px;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <h1>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        Cài đặt
    </h1>

    <!-- General Settings -->
    <div class="section">
        <h2>⚙️ Chung</h2>
        <div class="form-group">
            <div class="row">
                <label>🔄 Tự động phát hiện video</label>
                <label class="toggle">
                    <input type="checkbox" id="autoDetect" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="form-group">
            <div class="row">
                <label>📌 Hiển thị nút tải trên video</label>
                <label class="toggle">
                    <input type="checkbox" id="showOverlay" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="form-group">
            <label>📦 Kích thước file tối thiểu (KB)</label>
            <input type="number" id="minFileSize" value="100" min="0" step="10">
            <div class="hint">Bỏ qua các file nhỏ hơn kích thước này</div>
        </div>
        <div class="form-group">
            <label>⚡ Số lượng tải đồng thời tối đa</label>
            <input type="number" id="maxConcurrent" value="3" min="1" max="10">
        </div>
    </div>

    <!-- Download Settings -->
    <div class="section">
        <h2>📥 Tải xuống</h2>
        <div class="form-group">
            <label>📁 Thư mục lưu mặc định</label>
            <input type="text" id="downloadPath" placeholder="Để trống để dùng thư mục mặc định của trình duyệt">
            <div class="hint">Ví dụ: Downloads/Videos</div>
        </div>
    </div>

    <!-- Site Filters -->
    <div class="section">
        <h2>🌐 Lọc trang web</h2>
        <div class="form-group">
            <label>✅ Chỉ hoạt động trên các trang (mỗi dòng 1 domain)</label>
            <textarea id="enabledSites" placeholder="youtube.com&#10;vimeo.com&#10;tiktok.com"></textarea>
            <div class="hint">Để trống = hoạt động trên tất cả trang</div>
        </div>
        <div class="form-group">
            <label>🚫 Vô hiệu hóa trên các trang (mỗi dòng 1 domain)</label>
            <textarea id="disabledSites" placeholder="netflix.com&#10;spotify.com"></textarea>
        </div>
    </div>

    <!-- File Type Filters -->
    <div class="section">
        <h2>🎬 Định dạng video</h2>
        <div class="form-group">
            <label>Định dạng video được phát hiện</label>
            <textarea id="videoFormats">.mp4
.webm
.mkv
.flv
.avi
.mov
.m3u8
.ts
.mpd</textarea>
            <div class="hint">Mỗi dòng 1 định dạng</div>
        </div>
        <div class="form-group">
            <label>🎵 Định dạng audio</label>
            <textarea id="audioFormats">.mp3
.aac
.ogg
.wav
.m4a
.flac</textarea>
        </div>
    </div>

    <!-- Actions -->
    <div class="actions">
        <button class="btn btn-primary" id="saveBtn">💾 Lưu cài đặt</button>
        <button class="btn btn-secondary" id="resetBtn">🔄 Khôi phục mặc định</button>
    </div>

    <script src="options.js"></script>
</body>

</html>
