services:
  backend:
    build:
      context: ./vid-download-server
      dockerfile: Dockerfile
    container_name: vidcatch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mounts the container's temporary VidCatch directory to a Docker volume
      # to persist the SQLite database and job states across container restarts.
      - vidcatch_data:/tmp/VidCatch
    env_file:
      - ./vid-download-server/.env.production
    environment:
      # Sensible defaults if not defined in .env.production
      - VIDCATCH_PUBLIC_BASE_URL=${VIDCATCH_PUBLIC_BASE_URL:-http://localhost:8000}
      - VIDCATCH_API_KEYS=${VIDCATCH_API_KEYS:-replace-with-long-random-key}
      - VIDCATCH_REQUIRE_API_KEY=${VIDCATCH_REQUIRE_API_KEY:-true}
      - VIDCATCH_CORS_ORIGINS=${VIDCATCH_CORS_ORIGINS:-http://localhost:3000,chrome-extension://*}
      - VIDCATCH_CORS_ORIGIN_REGEX=${VIDCATCH_CORS_ORIGIN_REGEX:-chrome-extension://.*}
      - VIDCATCH_MAX_GLOBAL_ACTIVE_JOBS=${VIDCATCH_MAX_GLOBAL_ACTIVE_JOBS:-4}
      - VIDCATCH_STORAGE_MAX_BYTES=${VIDCATCH_STORAGE_MAX_BYTES:-21474836480} # 20GB
      - VIDCATCH_YTDLP_CONCURRENT_FRAGMENTS=${VIDCATCH_YTDLP_CONCURRENT_FRAGMENTS:-8}

  frontend:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        # Build-time environment variables for Next.js
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: vidcatch-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  vidcatch_data:
